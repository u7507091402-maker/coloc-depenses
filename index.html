<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Splitly</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Couleur navigateur mobile -->
  <meta name="theme-color" content="#00c46a">

  <!-- Icône iPhone écran d’accueil -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon-512.png">

  <!-- Favicon navigateur -->
  <link rel="icon" type="image/png" sizes="32x32" href="icon-512.png">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Icônes Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@1.35.7/dist/umd/supabase.min.js"></script>
</head>

<body>

<div class="container">

  <!-- EN-TÊTE -->
  <div class="card header center">
    <h1 class="brand">
      <img src="icon-512.png" alt="Splitly" class="brand__logo">
      <span class="brand__text">
        <span class="brand__name">Splitly</span>
        <span class="brand__tagline">simplifie vos dépenses</span>
      </span>
    </h1>

    <button id="create-coloc-btn" class="primary">
      <i data-lucide="plus"></i> Créer une colocation
    </button>
  </div>

  <!-- LISTE DES COLOCATIONS -->
  <div class="card">
    <ul id="colocs-list">
      <li class="muted">Aucune colocation</li>
    </ul>
  </div>

  <!-- ÉDITEUR COLOCATION -->
  <div id="coloc-editor" class="card" style="display:none">

    <h2 id="editor-title">
      <i data-lucide="home"></i> Nouvelle colocation
    </h2>

    <!-- NOM -->
    <label for="coloc-name-input">Nom de la colocation</label>
    <input type="text" id="coloc-name-input" placeholder="Nom de la colocation">

    <hr>

    <!-- COLOCATAIRES -->
    <h3><i data-lucide="users"></i> Colocataires</h3>

    <ul id="users-list">
      <li class="muted">Aucun colocataire</li>
    </ul>

    <div class="row">
      <input type="text" id="new-user-name" placeholder="Nom du colocataire">
      <input type="number" id="new-user-weight" placeholder="Poids (0-1)" step="0.01" min="0" max="1">
      <button id="add-user-btn" class="secondary">
        <i data-lucide="user-plus"></i> Ajouter
      </button>
    </div>

    <hr>

    <div class="row">
      <button id="save-coloc-btn" class="primary">
        <i data-lucide="save"></i> Enregistrer
      </button>
      <button id="close-editor-btn" class="secondary">
        <i data-lucide="arrow-left"></i> Retour
      </button>
    </div>

  </div>

</div>

<!-- Scripts -->
<script src="api.js"></script>
<script src="index.js"></script>

<script>
  lucide.createIcons();
</script>

</body>
</html>
